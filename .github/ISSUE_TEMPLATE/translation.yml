name: Translation mistake
description: A wrong, awkward or cut-off text in the app or on pegel-dictation.app
labels: [translation]
body:
  - type: markdown
    attributes:
      value: Thanks for helping. You can write in your own language.
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Français
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Window or page, and roughly where on it
      placeholder: Settings, General, Tones
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Leave empty if you only want to point it out
